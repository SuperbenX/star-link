.reading-card-title{font-size:14px;font-weight:400;letter-spacing:.3px;color:rgba(255,255,255,0.9)}

<body>

<div id="splash">
  <div class="splash-title">星<span class="dot">·</span>链</div>
  <div class="splash-en">Star-Link</div>
  <div class="splash-tagline">天上的事，说给人听。</div>
  <button class="splash-cta" onclick="enterApp()">进入星链</button>
</div>

<div class="push-banner" id="pushBanner">
  <div class="push-banner-text" id="pushBannerText"></div>
  <button class="push-banner-dismiss" onclick="dismissPush()">&times;</button>
</div>

<div id="app">
  <div class="header">
    <div class="header-title">星<span>·</span>链</div>
    <div class="header-date" id="headerDate"></div>
  </div>
  <div class="scroll-wrap">
    <div class="pages" id="pages">
      <div class="page" id="page-daily"><div id="dailyDateNav"></div><div id="dailyContent"></div></div>
      <div class="page" id="page-chart"><div id="chartContent"></div></div>
      <div class="page" id="page-friends"><div id="friendsContent"></div></div>
      <div class="page" id="page-syn"><div id="synContent"></div></div>
      <div class="page" id="page-void"><div id="voidContent"></div></div>
      <div class="page" id="page-profile"><div id="profileContent"></div></div>
    </div>
  </div>
  <nav class="tab-bar">
    <button class="tab-item active" data-idx="0" onclick="switchTab(0,this)"><span class="indicator"></span><span class="icon">☽</span><span class="label">今日</span></button>
    <button class="tab-item" data-idx="1" onclick="switchTab(1,this)"><span class="indicator"></span><span class="icon">☉</span><span class="label">星图</span></button>
    <button class="tab-item" data-idx="2" onclick="switchTab(2,this)"><span class="indicator"></span><span class="icon">◈</span><span class="label">星群</span></button>
    <button class="tab-item" data-idx="3" onclick="switchTab(3,this)"><span class="indicator"></span><span class="icon">⊕</span><span class="label">合盘</span></button>
    <button class="tab-item" data-idx="4" onclick="switchTab(4,this)"><span class="indicator"></span><span class="icon">∞</span><span class="label">虚空</span></button>
    <button class="tab-item" data-idx="5" onclick="switchTab(5,this)"><span class="indicator"></span><span class="icon">·</span><span class="label">我</span></button>
  </nav>
</div>

<script>
const PAGE_CLASSES=['','chart','friends','syn','void','prof'];
var currentTab=0;
function switchTab(i,b){if(i===currentTab)return;document.querySelectorAll('.tab-item').forEach(function(t){t.classList.remove('active')});if(b)b.classList.add('active');document.getElementById('pages').className='pages'+(i>0?' '+PAGE_CLASSES[i]:'');currentTab=i;document.querySelector('.scroll-wrap').scrollTop=0;}
var pushShown=false;
function showPushBanner(){if(pushShown||!window._pushText)return;document.getElementById('pushBannerText').textContent=window._pushText;setTimeout(function(){document.getElementById('pushBanner').classList.add('show')},100);pushShown=true;}
function dismissPush(){document.getElementById('pushBanner').classList.remove('show');}
function enterApp(){document.getElementById('splash').classList.add('hide');document.getElementById('app').classList.add('show');var _bd=localStorage.getItem('birth_data');if(!_bd||_bd==='null'){showOnboard();return}document.getElementById('headerDate').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric'});loadData();}
async function loadData(){try{var r=await fetch('/api/daily/guest');var d=await r.json();window._pushText=d.push;}catch(e){}await loadDailyReading();initChart();}
function initChart(){var el=document.getElementById('chartContent');var s=localStorage.getItem('natal_reading');if(s){try{renderNatalReading(JSON.parse(s));return;}catch(_){}}renderBirthForm();}

function renderBirthForm(){document.getElementById('chartContent').innerHTML='<div class="birth-form"><div style="text-align:center;margin-bottom:6px"><div style="font-size:20px;margin-bottom:4px">☉</div><div style="font-size:15px;font-weight:350;color:rgba(255,255,255,0.92);margin-bottom:2px">生成你的本命星盘</div><div style="font-size:11px;color:rgba(255,255,255,0.46)">输入出生信息获取深度解读</div></div><div class="label">出生日期</div><input class="birth-input" id="bd" type="date" ><div class="label">出生时间</div><input class="birth-input" id="bt" type="time" value="05:00"><div class="label">出生城市</div><select class="birth-input" id="bcity" onchange="cityChange()"><option value="39.91,116.40,北京">北京</option><option value="31.23,121.47,上海">上海</option><option value="23.13,113.26,广州">广州</option><option value="22.54,114.06,深圳">深圳</option><option value="30.57,104.07,成都">成都</option><option value="22.82,115.82,陆丰碣石">广东陆丰碣石</option><option value="other">其他城市</option></select><div id="otherCity" style="display:none"><div class="label">城市名</div><input class="birth-input" id="bcityName" type="text" placeholder="输入城市名，如 杭州"></div><div class="label">名字（选填）</div><input class="birth-input" id="bname" type="text" placeholder="输入名字" value="Superben"><button class="birth-submit" onclick="submitNatal()">生成星盘</button><div class="birth-hint">数据仅存储在本地</div></div>';}
function cityChange(){document.getElementById('otherCity').style.display=document.getElementById('bcity').value==='other'?'block':'none';}
function onFriendCityChange(){var v=document.getElementById('fcity').value,el=document.getElementById('fotherCity');if(el)el.style.display=v==='other'?'block':'none';}
function onSynCityChange(){var v=document.getElementById('synBCity').value,el=document.getElementById('synOtherCity');if(el)el.style.display=v==='other'?'block':'none';}
async function submitNatal(){var date=document.getElementById('bd').value,time=document.getElementById('bt').value||'12:00',cval=document.getElementById('bcity').value,lat,lng;if(cval==='other'){lat=39.91;lng=116.40;}else{var p=cval.split(',');lat=parseFloat(p[0]);lng=parseFloat(p[1]);}if(!date||isNaN(lat)||isNaN(lng))return alert('请填写完整的出生信息');var btn=document.querySelector('.birth-submit');var _btn=btn;btn.innerHTML='<div class="pl-load" style="padding:0"><span style="background:#F5A623;animation-delay:0s;width:8px;height:8px"></span><span style="background:#A8A8A8;animation-delay:.1s;width:8px;height:8px"></span><span style="background:#8B7355;animation-delay:.2s;width:8px;height:8px"></span><span style="background:#D4899E;animation-delay:.3s;width:8px;height:8px"></span><span style="background:#D4735E;animation-delay:.4s;width:8px;height:8px"></span></div>';btn.disabled=true;try{var r=await fetch('/api/natal/reading',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({birthDate:date,birthTime:time,lat:lat,lng:lng,name:document.getElementById('bname').value||'用户'})});var d=await r.json();if(d.error)throw Error(d.error);localStorage.setItem('natal_reading',JSON.stringify(d));localStorage.setItem('birth_data',JSON.stringify({birthDate:date,birthTime:time,lat:lat,lng:lng}));renderNatalReading(d);}catch(e){alert('失败: '+e.message);btn.textContent='生成星盘';btn.disabled=false;}}

function fmtDate(d){return{str:d.toISOString().slice(0,10),md:(d.getMonth()+1)+'/'+d.getDate(),dow:['日','一','二','三','四','五','六'][d.getDay()]};}
function getDateRange(){var t=new Date(),ds=[];for(var i=-1;i<=1;i++){var d=new Date(t);d.setDate(d.getDate()+i);ds.push(fmtDate(d));}return{dates:ds,todayStr:fmtDate(t).str};}
var _selectedDate=null;
function renderDateNav(s){_selectedDate=s;var info=getDateRange();document.getElementById('dailyDateNav').innerHTML='<div class="date-nav">'+info.dates.map(function(d){var c=d.str===s?'active':(d.str<info.todayStr?'past':(d.str>info.todayStr?'future':''));return '<div class="date-nav-item '+c+'" onclick="onDateSelect(\''+d.str+'\')">'+d.md+'<span class="dow">'+d.dow+'</span></div>';}).join('')+'</div>';}
function onDateSelect(s){if(s===_selectedDate)return;renderDateNav(s);loadDailyReading(s);}
