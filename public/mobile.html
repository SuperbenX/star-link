<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>星链</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0e0e12;font-family:"PingFang SC","-apple-system","Helvetica Neue",sans-serif;color:rgba(255,255,255,0.9);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}

/* Splash */
#splash{position:fixed;inset:0;z-index:999;background:radial-gradient(#211d2e,#14111e);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s,transform .6s}
#splash.hide{opacity:0;transform:scale(1.03);pointer-events:none}
.splash-title{font-size:32px;font-weight:200;letter-spacing:10px;color:rgba(255,255,255,0.9);animation:fadeUp .8s ease .1s both}
.splash-sub{font-size:11px;letter-spacing:6px;color:rgba(255,255,255,0.5);margin-top:10px;animation:fadeUp .8s ease .3s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* App Layout */
#app{display:none;height:100dvh;flex-direction:column;background:#0e0e12}
#app.show{display:flex}
#scrollArea{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 80px}
#scrollArea::-webkit-scrollbar{display:none}

/* Tab Bar */
.tab-bar{position:fixed;bottom:0;left:0;right:0;height:56px;padding-bottom:env(safe-area-inset-bottom,0);background:rgba(20,17,30,0.95);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.06);display:flex;z-index:50}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:rgba(255,255,255,0.4);font-size:9px;cursor:pointer;padding:2px 0;font-family:inherit;letter-spacing:.5px}
.tab-btn.active{color:#a78bfa}
.tab-btn .icon{font-size:18px}

/* Forms */
.form-group{margin-bottom:14px}
.form-label{font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:1.5px;margin-bottom:6px;display:block}
.form-input,.form-select{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:12px 14px;font-size:15px;color:rgba(255,255,255,0.9);outline:none;font-family:inherit;box-sizing:border-box}
.form-input:focus,.form-select:focus{border-color:#a78bfa}
.form-input::placeholder{color:rgba(255,255,255,0.25)}
.form-select option{background:#121216;color:rgba(255,255,255,0.9)}
.btn-primary,.btn-secondary{width:100%;border-radius:8px;padding:14px;font-size:14px;cursor:pointer;font-family:inherit;letter-spacing:2px;margin-top:4px;border:none}
.btn-primary{background:#a78bfa;color:#fff}
.btn-primary:disabled{opacity:.3}
.btn-secondary{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.6)}

/* Cards */
.card{background:#121216;border:1px solid rgba(255,255,255,0.05);border-radius:10px;padding:14px;margin-bottom:10px}

/* Section Titles */
.sec-title{font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:2px;margin:20px 0 8px}

/* Loading */
.loading{display:flex;gap:8px;justify-content:center;padding:40px 0}
.loading span{width:10px;height:10px;border-radius:50%;animation:pl 1.5s ease infinite;opacity:.3}
.loading span:nth-child(1){background:#F5A623;animation-delay:0s}
.loading span:nth-child(2){background:#A8A8A8;animation-delay:.12s}
.loading span:nth-child(3){background:#8B7355;animation-delay:.24s}
.loading span:nth-child(4){background:#D4899E;animation-delay:.36s}
.loading span:nth-child(5){background:#D4735E;animation-delay:.48s}
@keyframes pl{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}

/* Toast */
.toast-overlay{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;background:rgba(0,0,0,0.85);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;max-width:80%;text-align:center}

/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:24px}
.modal-content{background:linear-gradient(180deg,#1a182c,#100e1e);border:1px solid rgba(167,139,250,0.12);border-radius:20px;padding:28px 24px;max-width:380px;width:100%;max-height:70vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:14px;right:14px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:rgba(255,255,255,0.35);font-size:16px;cursor:pointer}

/* Daily Pills */
.pill-group{display:flex;gap:6px;padding:4px 0;margin-bottom:8px;overflow-x:auto}
.pill{flex-shrink:0;padding:5px 14px;border-radius:999px;font-size:10px;color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);cursor:pointer;font-family:inherit}
.pill.active{background:#a78bfa;color:#fff;border-color:#a78bfa}

/* Daily Card */
.daily-card{background:#121216;border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:16px;margin-bottom:10px}
.daily-card-label{font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:1px;margin-bottom:6px}
.daily-divider{height:1px;background:rgba(255,255,255,0.06);margin:8px 0}
.daily-push{font-size:16px;color:rgba(255,255,255,0.92);margin-bottom:10px;display:block}
.daily-body{font-size:14px;color:rgba(255,255,255,0.78);line-height:1.8}
.daily-hook{text-align:center;font-size:16px;color:rgba(255,255,255,0.5);display:block}
.empty-state{text-align:center;padding:60px 0;font-size:13px;color:rgba(255,255,255,0.4)}
.push-banner{background:rgba(167,139,250,0.1);border:1px solid rgba(167,139,250,0.15);border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:13px;color:#c4b5fd;line-height:1.6}

/* 每日星座日签（未登录） */
.guest-sign-wrap{text-align:center;padding:18px 0 16px}
.guest-sign-glyph{font-size:52px;color:#2DD4BF;line-height:1;margin-bottom:6px}
.guest-sign-name{font-size:26px;font-weight:500;color:rgba(255,255,255,0.92);letter-spacing:1px}
.guest-sign-sub{font-size:11px;color:rgba(255,255,255,0.4);margin-top:6px;letter-spacing:2px}
.op-share-btn{width:100%;background:rgba(45,212,191,0.12);border:1px solid rgba(45,212,191,0.35);color:#2DD4BF;border-radius:8px;padding:14px;font-size:14px;cursor:pointer;margin:14px 0;font-family:inherit;letter-spacing:2px}
.guest-cta{margin:6px 0 10px;padding:16px 18px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:10px;cursor:pointer;text-align:center}
.guest-cta-main{font-size:14px;color:rgba(255,255,255,0.85)}
.guest-cta-sub{font-size:10px;color:rgba(255,255,255,0.4);margin-top:4px;line-height:1.6}

/* Date Nav */
.date-nav{display:flex;gap:4px;margin-bottom:12px}
.date-btn{flex:1;text-align:center;padding:6px 2px;border-radius:6px;font-size:10px;color:rgba(255,255,255,0.5);background:none;border:1px solid transparent;cursor:pointer;font-family:inherit}
.date-btn.active{background:rgba(167,139,250,0.15);border-color:rgba(167,139,250,0.3);color:#a78bfa}
.date-btn .dow{font-size:8px;display:block;margin-top:2px;opacity:.6}

/* Transit Alerts */
.alert-card{padding:10px 12px;border-radius:8px;margin-bottom:6px;border-left:2px solid}
.alert-high{background:rgba(167,139,250,0.12);border-color:#a78bfa}
.alert-mid{background:rgba(255,217,61,0.08);border-color:#FFD93D}
.alert-low{background:rgba(255,255,255,0.03);border-color:rgba(255,255,255,0.15)}
.alert-head{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.alert-aspect{font-size:10px;color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.06);padding:2px 8px;border-radius:999px}
.alert-bodies{font-size:10px;color:rgba(255,255,255,0.5);margin-bottom:4px}
.alert-tip{font-size:10px;color:rgba(255,255,255,0.7);line-height:1.5}

/* Aspect Chips */
.aspect-chips{display:flex;flex-direction:column;gap:4px}
.aspect-chip{display:flex;align-items:center;gap:8px;background:#121216;border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:10px 12px}
.chip-score{font-size:12px;color:rgba(255,255,255,0.9);width:28px;text-align:right}
.chip-name{font-size:10px;color:rgba(255,255,255,0.5);width:30px}
.chip-bodies{flex:1;font-size:11px;color:rgba(255,255,255,0.7)}
.chip-tip{font-size:9px;color:rgba(255,255,255,0.5);margin-top:2px;line-height:1.4}

/* Domain Grid */
.domain-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.domain-card{padding:10px;background:#121216;border:1px solid rgba(255,255,255,0.05);border-radius:8px}
.domain-card-title{font-size:11px;color:#a78bfa;margin-bottom:4px;font-weight:400}
.domain-card-body{font-size:11px;color:rgba(255,255,255,0.65);line-height:1.6}

/* Advice Grid */
.advice-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.advice-card{padding:8px 10px;background:#121216;border:1px solid rgba(255,255,255,0.05);border-radius:6px}
.advice-label{font-size:7px;color:#a78bfa;letter-spacing:1px;margin-bottom:2px}
.advice-text{font-size:11px;color:rgba(255,255,255,0.7);line-height:1.5}
.tag{display:inline-block;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.5);font-size:10px;padding:2px 10px;border-radius:999px;margin:2px 4px}

/* Big3 */
.big3{display:flex;gap:8px;margin-bottom:10px}
.big3-item{flex:1;background:#121216;border-radius:10px;padding:14px 8px;text-align:center}
.big3-label{font-size:8px;color:rgba(255,255,255,0.4);letter-spacing:2px;margin-bottom:6px}
.big3-sign{font-size:16px;font-weight:300;color:rgba(255,255,255,0.9)}
.big3-deg{font-size:10px;color:rgba(255,255,255,0.4);margin-top:2px}

/* Elements */
.elements{display:flex;gap:4px;margin-bottom:10px}
.element-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.element-dot{width:10px;height:10px;border-radius:50%}
.element-pct{font-size:14px;font-weight:400;font-family:Menlo,monospace;color:rgba(255,255,255,0.9)}
.element-label{font-size:8px;color:rgba(255,255,255,0.4)}

/* Planets */
.planet-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.planet-cell{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#121216;border:1px solid rgba(255,255,255,0.05);border-radius:8px;cursor:pointer}
.planet-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.planet-name{font-size:11px;color:rgba(255,255,255,0.9)}
.planet-pos{font-size:9px;color:rgba(255,255,255,0.4);margin-top:1px}

/* Reading Cards */
.reading-card{padding:12px 14px;background:#121216;border:1px solid rgba(255,255,255,0.05);border-radius:8px;margin-bottom:4px}
.reading-card-title{font-size:12px;color:rgba(255,255,255,0.9);margin-bottom:2px}
.reading-card-sub{font-size:9px;color:rgba(255,255,255,0.4);margin-bottom:6px}
.reading-card-body{font-size:12px;color:rgba(255,255,255,0.75);line-height:1.7}
.reading-card-kw{display:inline-block;background:rgba(255,255,255,0.06);border-radius:999px;padding:2px 8px;font-size:8px;color:rgba(255,255,255,0.5);margin-top:6px}

/* Friends */
.friend-item{display:flex;align-items:center;gap:10px;padding:12px;background:#121216;border:1px solid rgba(255,255,255,0.05);border-radius:8px;margin-bottom:4px}
.friend-name{font-size:14px;color:rgba(255,255,255,0.9)}
.friend-sign{font-size:10px;color:rgba(255,255,255,0.4);margin-top:1px}
.friend-del{margin-left:auto;background:none;border:none;color:rgba(255,255,255,0.25);font-size:16px;cursor:pointer;padding:4px;font-family:inherit}

/* Synastry */
.syn-item{font-size:12px;color:rgba(255,255,255,0.7);padding:4px 0;line-height:1.6}
.syn-role-card{padding:10px;background:#121216;border:1px solid rgba(255,255,255,0.05);border-radius:8px;margin-bottom:4px}
.syn-role-name{font-size:13px;color:rgba(255,255,255,0.9);margin-bottom:4px}
.syn-role-why{font-size:12px;color:rgba(255,255,255,0.6);line-height:1.6}
.syn-group-result{margin-bottom:12px}

/* Void */
.void-header{text-align:center;padding:20px 0}
.void-title{font-size:20px;font-weight:200;letter-spacing:6px;color:rgba(255,255,255,0.9)}
.void-sub{font-size:10px;letter-spacing:4px;color:rgba(255,255,255,0.4);margin-top:6px}
.void-domains{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:14px}
.void-btn{padding:6px 14px;border-radius:999px;font-size:10px;color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);cursor:pointer;font-family:inherit}
.void-btn.active{background:rgba(167,139,250,0.12);color:#a78bfa;border-color:rgba(167,139,250,0.2)}
.void-preset{display:block;width:100%;text-align:center;padding:10px;margin-bottom:4px;background:#121216;border:1px solid rgba(255,255,255,0.05);border-radius:8px;font-size:12px;color:rgba(255,255,255,0.6);cursor:pointer;font-family:inherit}
.void-input-wrap{display:flex;gap:6px;margin-top:10px}
.void-input{flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:12px;font-size:14px;color:rgba(255,255,255,0.9);outline:none;font-family:inherit}
.void-input::placeholder{color:rgba(255,255,255,0.25)}

/* Profile */
.profile-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;color:rgba(255,255,255,0.75)}
.profile-item:last-child{border-bottom:none}
.profile-val{color:rgba(255,255,255,0.4);font-size:12px}
</style>
</head>

function todayStr(offset){var d=new Date();if(offset)d.setDate(d.getDate()+offset);return toDateStr(d)}
function getDateNav(){var dates=[],t=new Date();for(var i=-7;i<=7;i++){var d=new Date(t);d.setDate(d.getDate()+i);dates.push({str:toDateStr(d),md:(d.getMonth()+1)+'/'+d.getDate(),dow:['日','一','二','三','四','五','六'][d.getDay()],isToday:i===0})}return dates}

function apiGet(path){return fetch(API_BASE+path).then(function(r){return r.json()})}

function calcElements(positions){var c={fire:0,earth:0,air:0,water:0},emap={火象:['白羊座','狮子座','射手座'],土象:['金牛座','处女座','摩羯座'],风象:['双子座','天秤座','水瓶座'],水象:['巨蟹座','天蝎座','双鱼座']};for(var p of positions){for(var k in emap){if(emap[k].indexOf(p.sign)>=0){c[['fire','earth','air','water']['火土风水'.indexOf(k[0])]]++;break}}}var t=c.fire+c.earth+c.air+c.water||1;return{fire:Math.round(c.fire/t*100),earth:Math.round(c.earth/t*100),air:Math.round(c.air/t*100),water:Math.round(c.water/t*100)}}

function drawChart(){
  var cv=$('zodiacCanvas');if(!cv)return;
  var ctx=cv.getContext('2d'),size=280,cx=size/2,cy=size/2,R=size*0.38,sr=size*0.27;
  var pos=natalReading?natalReading.positions||[]:[];
  ctx.clearRect(0,0,size,size);
  for(var i=0;i<12;i++){
    var a1=(-90+i*30)*Math.PI/180,a2=(-90+(i+1)*30)*Math.PI/180;
    ctx.beginPath();ctx.arc(cx,cy,R,a1,a2);ctx.arc(cx,cy,sr,a2,a1,true);ctx.closePath();
    ctx.fillStyle=i%2===0?'rgba(167,139,250,0.12)':'rgba(167,139,250,0.04)';ctx.fill();
    ctx.beginPath();ctx.moveTo(cx+sr*Math.cos(a2),cy+sr*Math.sin(a2));ctx.lineTo(cx+R*Math.cos(a2),cy+R*Math.sin(a2));
    ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=0.8;ctx.stroke();
  }
  ctx.beginPath();ctx.arc(cx,cy,sr,0,2*Math.PI);ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=0.8;ctx.stroke();
  // Aspect lines
  for(var i=0;i<pos.length;i++){for(var j=i+1;j<pos.length;j++){
    var dist=Math.abs(((pos[i].lon-pos[j].lon)%360+360)%360),d=Math.min(dist,360-dist),aspects=[[0,8],[60,4],[90,6],[120,6],[180,8]];
    for(var ai=0;ai<aspects.length;ai++){if(Math.abs(d-aspects[ai][0])<=aspects[ai][1]){
      var a1=(-90+pos[i].lon)*Math.PI/180,a2=(-90+pos[j].lon)*Math.PI/180;
      ctx.beginPath();ctx.moveTo(cx+R*Math.cos(a1),cy+R*Math.sin(a1));ctx.lineTo(cx+R*Math.cos(a2),cy+R*Math.sin(a2));
      ctx.strokeStyle='rgba(167,139,250,'+(0.3+0.4*(1-Math.abs(d-aspects[ai][0])/aspects[ai][1]))+')';ctx.lineWidth=aspects[ai][0]===0?1:0.6;
      if(aspects[ai][0]!==0)ctx.setLineDash([3,4]);ctx.stroke();ctx.setLineDash([]);break;
    }}
  }}
  // Planets
  for(var p of pos){
    var angle=(-90+p.lon)*Math.PI/180,px=cx+R*Math.cos(angle),py=cy+R*Math.sin(angle),col=PLANET_COLORS[p.body]||'#d4bc9a',r2=p.body==='Sun'||p.body==='Moon'?4:3;
    ctx.beginPath();ctx.arc(px,py,r2,0,2*Math.PI);ctx.fillStyle=col;ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=0.8;ctx.stroke();
  }
  ctx.fillStyle='rgba(255,255,255,0.12)';ctx.font='8px "PingFang SC"';ctx.textAlign='center';ctx.fillText('STAR',cx,cy-3);ctx.fillText('LINK',cx,cy+6);
}

function showGroupResult(d,name){
  var r=d.reading||{};
  var html='<div class="sec-title" style="margin-top:0">'+name+' · 群组分析</div><div class="card"><div style="font-size:16px;color:rgba(255,255,255,0.92)">'+(r.push||'')+'</div>'+(r.summary?'<div style="font-size:14px;color:rgba(255,255,255,0.75);line-height:1.7;margin-top:8px">'+r.summary+'</div>':'')+'</div>';
  // 角色分配
  if(r.roles&&r.roles.length){html+='<div class="sec-title">角色分配</div>';r.roles.forEach(function(rr){html+='<div class="syn-role-card"><div class="syn-role-name">'+rr.member+' — '+rr.role+'</div><div class="syn-role-why">'+rr.why+'</div></div>'})}
  // 领域分析（和合盘一致）
  if(r.domains){html+='<div class="sec-title">领域分析</div><div class="domain-grid">';var dl3={emotional:'情感氛围',intellectual:'沟通效率',action:'行动力',growth:'共同成长',challenge:'需要留意',business:'合作效能'};for(var k in dl3){var dm=r.domains[k];if(dm&&dm.analysis)html+='<div class="domain-card"><div class="domain-card-title">'+dl3[k]+(dm.score?' <span style="font-size:9px;color:rgba(255,255,255,0.4)">('+dm.score+')</span>':'')+'</div><div class="domain-card-body">'+dm.analysis+'</div></div>'}html+='</div>'}
  // 关键词
  if(r.keywords&&r.keywords.length){html+='<div style="text-align:center;padding:6px 0">';r.keywords.forEach(function(kw){html+='<span class="tag">'+kw+'</span>'});html+='</div>'}
  // 优势
  if(r.strengths&&r.strengths.length){html+='<div class="sec-title">优势</div>';r.strengths.forEach(function(s){html+='<div class="syn-item">• '+s+'</div>'})}
  // 挑战（保留原有深度）
  if(r.challenges&&r.challenges.length){html+='<div class="sec-title">挑战</div>';r.challenges.forEach(function(s){html+='<div class="syn-item">• '+s+'</div>'})}
  // 行动指南
  if(r.advice){html+='<div class="advice-grid" style="margin-top:8px">';var am4={collaboration:'协作',decision:'决策',conflict:'冲突',growth:'成长'};for(var k in am4){if(r.advice[k])html+='<div class="advice-card"><div class="advice-label">'+am4[k]+'</div><div class="advice-text">'+r.advice[k]+'</div></div>'}html+='</div>'}
  closeModal();showModal(html);
}

function submitSynastry(){
  var name=$('sName').value,date=$('sDate').value,time=$('sTime').value||'12:00',rel=$('sRelation').value;
  if(!name||!date){toast('请填写完整');return}
  if(!birthData){toast('请先生成性格画像');return}
  showModal('<div class="loading"><span></span><span></span><span></span><span></span><span></span></div>');
  apiPost('/api/synastry-ds/deepseek',{birthDataA:{birthDate:birthData.birthDate,birthTime:birthData.birthTime,lat:birthData.lat,lng:birthData.lng},birthDataB:{birthDate:date,birthTime:time,lat:39.91,lng:116.40},nameA:'你',nameB:name,relationshipType:rel}).then(function(d){
    showSynastryResult(d,name);
  }).catch(function(){toast('分析失败')});
}

var voidDomain='love';
var VL={love:'爱情',friends:'友谊',work:'事业',family:'家庭',growth:'个人成长',finance:'财务',health:'健康'};
var VQ={love:['我容易吸引什么样的人？','我在关系中最大的模式是什么？','我在爱情中最大的弱点是什么？','什么样的相处方式最适合我？'],friends:['我在友谊中扮演什么角色？','什么样的朋友最适合我？','我的社交模式有什么特点？'],work:['我的职业天赋是什么？','什么样的工作最适合我？','我适合创业还是打工？'],family:['我的家庭模式对我有什么影响？','我该如何与家人更好地相处？'],growth:['我这一生的核心课题是什么？','我该如何突破当前的困境？'],finance:['我与金钱的关系是什么？','我的财务趋势如何？'],health:['我的身体能量特点是什么？','我需要留意哪些健康领域？']};

function renderVoid(){
  var el=$('scrollArea');
  var html='<div class="void-header"><div class="void-title">虚空</div><div class="void-sub">ASK THE VOID</div></div><div class="void-domains">';
  for(var k in VL)html+='<button class="void-btn'+(k===voidDomain?' active':'')+'" onclick="voidDomain=\''+k+'\';renderVoid()">'+VL[k]+'</button>';
  html+='</div>';
  var qs=VQ[voidDomain]||[];
  if(qs.length){html+='<div class="sec-title">选择一个问题</div>';qs.forEach(function(q){html+='<button class="void-preset" onclick="askVoid(\''+q.replace(/'/g,"\\'")+'\')">'+q+'</button>'})}
  html+='<div class="form-group" style="margin-top:10px"><div class="form-label">或输入你的问题</div><input class="void-input" id="vInput" placeholder="输入关于 '+(VL[voidDomain]||'')+' 的问题..."></div><button class="btn-primary" onclick="askVoid(\'\')">提问</button>';
  el.innerHTML=html;
}

function askVoid(q){
  var inp=$('vInput');if(!q&&inp)q=inp.value.trim();
  if(!q){toast('请输入问题');return}
  if(!birthData){toast('请先生成性格画像');return}
  showModal('<div class="loading"><span></span><span></span><span></span><span></span><span></span></div>');
  apiPost('/api/void/ask',{question:q,domain:voidDomain,birthData:birthData}).then(function(d){
    closeModal();showModal('<div class="void-modal-text">'+(d.answer||'暂无回答')+'</div>');
  }).catch(function(){toast('回答失败')});
}

function renderProfile(){
  var el=$('scrollArea');

  if(birthData){
    html+='<div class="card"><div class="profile-item"><span>日期</span><span class="profile-val">'+birthData.birthDate+'</span></div><div class="profile-item"><span>时间</span><span class="profile-val">'+birthData.birthTime+'</span>'+(birthData.timeUnknown?'<span style="font-size:10px;color:#a78bfa;cursor:pointer" onclick="showTimeCorrection()">未知 · 校正</span>':'')+'</div><div class="profile-item" style="border-bottom:none"><span>地点</span><span class="profile-val">39.91, 116.40</span></div></div>';

  } else {
    html+='<div class="card"><div class="profile-item" style="border-bottom:none;justify-content:center;padding:20px 0"><span style="font-size:13px;color:rgba(255,255,255,0.5)">尚未录入</span></div></div>';

  html+='<div class="sec-title">关于</div><div class="card"><div class="profile-item" onclick="showModal(\'<div style=font-size:13px;line-height:1.8;color:rgba(255,255,255,0.8)>Star-Link 尊重你的隐私。所有数据均存储在本地。使用 DeepSeek API 生成性格分析，仅传输行星位置数据，不收集任何个人身份信息。</div>\')" style="cursor:pointer"><span>隐私政策</span><span style="color:rgba(255,255,255,0.2)">›</span></div><div class="profile-item" style="border-bottom:none" onclick="showModal(\'<div style=font-size:13px;line-height:1.8;color:rgba(255,255,255,0.8)>ORA星链 v1.0.0<br>基于天文数据和 AI 的性格分析工具<br><br>ORA · 天上的事，说给人听</div>\')" style="cursor:pointer"><span>关于</span><span style="color:rgba(255,255,255,0.2)">›</span></div></div>';
  html+='<button class="btn-secondary" onclick="if(confirm(\'确定要清除所有数据？\')){localStorage.clear();birthData=null;natalReading=null;friends=[];groups=[];renderProfile()}" style="margin-top:10px;color:rgba(255,255,255,0.3)">重置所有数据</button>';
  el.innerHTML=html;
}

function clearCache(){
  var keys=Object.keys(localStorage);
  for(var i=0;i<keys.length;i++){if(keys[i].indexOf('daily_reading_')===0)localStorage.removeItem(keys[i]);}
  dailyData=null;toast('缓存已清理');
}

function editProfile(){
  showModal('<div class="form-group"><div class="form-label">出生日期</div><input class="form-input" id="eDate" type="date" value="'+(birthData?birthData.birthDate:'1990-01-01')+'"></div><div class="form-group"><div class="form-label">出生时间</div><input class="form-input" id="eTime" type="time" value="'+(birthData?birthData.birthTime:'12:00')+'"></div><div class="form-group"><div class="form-label">出生城市</div><input class="form-input" id="eCity" placeholder="如 北京" value="北京"></div><button class="btn-primary" onclick="saveProfile()">保存</button>');
}
function saveProfile(){
  var d=$('eDate').value,t=$('eTime').value||'12:00';
  if(!d){toast('请选择日期');return}
  birthData={birthDate:d,birthTime:t,lat:39.91,lng:116.40};
  store('birth_data',birthData);natalReading=null;store('natal_reading',null);
  closeModal();renderProfile();toast('已保存');
}
